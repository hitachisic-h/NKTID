<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TID App">
  <meta name="theme-color" content="#0a0a0a">
  
  <title>TID App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
            mono: ['Inter', 'monospace'],
          },
          colors: {
            nankai: {
              green: '#00875A',
              lightgreen: '#10B981',
              dark: '#0a0a0a',       // ベース最深背景
              panel: '#0e0e0e',      // パネル背景（輝度差を小さく）
              card: '#141414',       // カード背景（輝度差を小さく）
              border: '#1f1f1f',     // ボーダー色（目立たない深め）
              up: '#0ea5e9',
              down: '#f43f5e'
            }
          }
        }
      }
    };
  </script>
  
  <style>
    .font-inter {
      font-family: 'Inter', sans-serif !important;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222222; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00875A; }

    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body, header, nav, main, div, button {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    /* 定速スクロール用アニメーション */
    @keyframes tickerAnimKeyframe {
      0% { transform: translateX(var(--ticker-start-pos, 100%)); }
      100% { transform: translateX(var(--ticker-end-pos, -100%)); }
    }

    .animate-ticker-dynamic {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: tickerAnimKeyframe var(--ticker-duration, 20s) linear forwards;
    }

    @media (max-width: 639px) {
      .modal-bottom-sheet {
        align-items: flex-end !important;
      }
      .modal-bottom-sheet > div {
        border-bottom-left-radius: 0 !important;
        border-bottom-right-radius: 0 !important;
        max-height: 85vh;
        overflow-y: auto;
      }
    }
  </style>
</head>

<body class="bg-slate-100 dark:bg-nankai-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-nankai-green selection:text-white pb-32 sm:pb-36">

  <!-- 1. HEADER NAVBAR -->
  <header class="bg-white dark:bg-nankai-panel border-b border-slate-200 dark:border-nankai-border px-3 py-2 sm:px-5 sm:py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      
      <!-- ロゴ & タイトル & ダイヤ時刻情報 -->
      <div class="flex items-center gap-2 sm:gap-2.5 min-w-0">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-nankai-green to-emerald-600 flex items-center justify-center shadow-xs border border-emerald-400/30 shrink-0">
          <i data-lucide="train" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <h1 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white tracking-tight truncate">TID App</h1>
          </div>
          
          <!-- 南海線/高野線 ダイヤ情報 -->
          <div id="metaInfoDisplay" class="text-[9px] sm:text-[10px] text-slate-600 dark:text-slate-400 flex items-center gap-1.5 sm:gap-2 flex-wrap mt-0.5">
            <span>南海: <b id="metaNankaiTime" class="font-inter">--:--:--</b> <span id="metaNankaiType" class="text-[8px] bg-emerald-500/20 text-emerald-800 dark:text-emerald-300 px-1 py-0.2 rounded font-inter font-bold">ID: -</span></span>
            <span class="text-slate-300 dark:text-slate-700">|</span>
            <span>高野: <b id="metaKoyaTime" class="font-inter">--:--:--</b> <span id="metaKoyaType" class="text-[8px] bg-emerald-500/20 text-emerald-800 dark:text-emerald-300 px-1 py-0.2 rounded font-inter font-bold">ID: -</span></span>
          </div>
        </div>
      </div>

      <!-- モード切替 & テーマ・設定ボタン -->
      <div class="flex flex-col sm:flex-row items-end sm:items-center gap-1.5 sm:gap-2 shrink-0">
        <div class="bg-slate-200 dark:bg-nankai-dark p-1 rounded-xl border border-slate-300 dark:border-nankai-border flex gap-0.5">
          <button id="viewBtnDiagram" onclick="setViewMode('diagram')" class="px-2 py-0.5 sm:px-2.5 sm:py-1 text-[10px] sm:text-xs font-bold rounded-lg bg-nankai-green text-white flex items-center gap-1 transition active:scale-95">
            <i data-lucide="route" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i>
            <span>路線図</span>
          </button>
          <button id="viewBtnCards" onclick="setViewMode('cards')" class="px-2 py-0.5 sm:px-2.5 sm:py-1 text-[10px] sm:text-xs font-bold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1 transition active:scale-95">
            <i data-lucide="layout-grid" class="w-3 h-3 sm:w-3.5 sm:h-3.5"></i>
            <span>一覧</span>
          </button>
        </div>

        <div class="flex items-center gap-1">
          <button onclick="toggleTheme()" class="p-1.5 sm:p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-nankai-card border border-slate-300 dark:border-nankai-border rounded-xl transition" title="テーマ切り替え">
            <i data-lucide="sun" id="desktopThemeIconSun" class="w-3.5 h-3.5 sm:w-4 sm:h-4 hidden dark:block"></i>
            <i data-lucide="moon" id="desktopThemeIconMoon" class="w-3.5 h-3.5 sm:w-4 sm:h-4 block dark:hidden"></i>
          </button>

          <button onclick="openModal('dataConfigModal')" class="p-1.5 sm:p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-nankai-card border border-slate-300 dark:border-nankai-border rounded-xl transition" title="設定">
            <i data-lucide="settings" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- 2. STICKY OPERATIONAL STATUS HEADER -->
  <div id="statusHeaderBar" onclick="openModal('trainInfoModal')" class="sticky top-0 z-30 cursor-pointer bg-emerald-500/10 dark:bg-emerald-950/20 backdrop-blur-md hover:bg-emerald-500/20 dark:hover:bg-emerald-950/40 border-b border-emerald-500/20 px-3 py-2 sm:px-5 transition-all shadow-xs">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 text-xs overflow-hidden">
      
      <div id="statusContentArea" class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden transition-opacity duration-300 opacity-100">
        <i id="statusIcon" data-lucide="circle" class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0"></i>
        
        <div class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden">
          <span id="lineStatusText" class="font-extrabold tracking-wide shrink-0 text-xs sm:text-sm text-slate-900 dark:text-emerald-200">南海本線 平常運行</span>
          
          <div id="tickerWrapper" class="hidden min-w-0 flex-1 overflow-hidden relative h-5 flex items-center">
            <div id="tickerText" class="text-xs font-bold text-amber-700 dark:text-amber-300"></div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1 shrink-0 text-[11px] font-bold text-slate-600 dark:text-slate-300 bg-white/40 dark:bg-nankai-card/40 backdrop-blur-xs px-2 py-0.5 rounded-lg border border-slate-200/50 dark:border-nankai-border/50">
        <span>運行情報</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </div>

    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-0 sm:px-0 flex flex-col gap-0">
    
    <!-- MAIN DIAGRAM CONTAINER -->
    <div id="diagramContainer" class="bg-white dark:bg-nankai-dark border-b border-slate-200 dark:border-nankai-border/40 shadow-none overflow-hidden flex flex-col w-full">
      <div id="diagramContent" class="divide-y divide-slate-200/50 dark:divide-nankai-border/20 w-full">
        <!-- JS Rendered Diagram Rows -->
      </div>
    </div>

    <!-- CARDS VIEW -->
    <div id="cardsContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 p-3 sm:p-4">
      <!-- JS Rendered Train Cards -->
    </div>

  </main>

  <!-- 3. BOTTOM SEARCH BAR -->
  <div id="bottomSearchBar" class="hidden fixed bottom-16 left-0 right-0 z-30 px-3 py-2 bg-white/90 dark:bg-nankai-panel/90 backdrop-blur-md border-t border-slate-200 dark:border-nankai-border shadow-lg">
    <div class="max-w-md mx-auto relative flex items-center">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 text-slate-400"></i>
      <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="列番・目的地・車番で検索..." 
        class="w-full pl-9 pr-8 py-2 text-xs bg-slate-100 dark:bg-nankai-dark border border-slate-300 dark:border-nankai-border rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-nankai-green transition shadow-inner font-inter">
      <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>

  <!-- 4. FLOATING BIG REFRESH BUTTON -->
  <div class="fixed bottom-14 sm:bottom-16 right-3 sm:right-6 z-40">
    <button onclick="refreshData()" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-xl border border-emerald-400/30 flex items-center gap-2 transition-all transform active:scale-95 group cursor-pointer" title="手動更新">
      <i data-lucide="refresh-cw" class="w-5 h-5 sm:w-6 sm:h-6 refresh-icon"></i>
      <span class="text-xs sm:text-sm tracking-wide">更新</span>
    </button>
  </div>

  <!-- 5. FIXED BOTTOM LINE SELECTION HEADER -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 dark:bg-nankai-panel/95 backdrop-blur-md border-t border-slate-200 dark:border-nankai-border px-2 sm:px-4 py-2 shadow-2xl">
    <div class="max-w-7xl mx-auto flex flex-col gap-1.5">
      
      <div class="flex items-center space-x-1 sm:space-x-1.5 overflow-x-auto no-scrollbar py-0.5 w-full">
        <button onclick="selectLine('nankai')" id="lineTab-nankai" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-bold rounded-xl border transition flex items-center gap-1.5 border-blue-500 bg-blue-500/20 text-slate-900 dark:text-white shrink-0">
          <span class="w-2.5 h-2.5 rounded-xs bg-blue-500"></span>
          <span>南海本線</span>
        </button>

        <button onclick="selectLine('kuko')" id="lineTab-kuko" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2.5 h-2.5 rounded-xs bg-purple-600"></span>
          <span>空港線</span>
        </button>

        <button onclick="selectLine('koya')" id="lineTab-koya" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2.5 h-2.5 rounded-xs bg-emerald-600"></span>
          <span>高野線</span>
        </button>

        <button onclick="selectLine('senboku')" id="lineTab-senboku" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2.5 h-2.5 rounded-xs bg-lime-500"></span>
          <span>泉北線</span>
        </button>

        <div class="hidden md:flex items-center space-x-1 sm:space-x-1.5 shrink-0">
          <button onclick="selectLine('kada')" id="lineTab-kada-desktop" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-xs bg-blue-500"></span>
            <span>加太線</span>
          </button>

          <button onclick="selectLine('tanagawa')" id="lineTab-tanagawa-desktop" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-xs bg-blue-500"></span>
            <span>多奈川線</span>
          </button>

          <button onclick="selectLine('takashinhama')" id="lineTab-takashinhama-desktop" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-xs bg-blue-500"></span>
            <span>高師浜線</span>
          </button>

          <button onclick="selectLine('shiomibashi')" id="lineTab-shiomibashi-desktop" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-xs bg-emerald-600"></span>
            <span>汐見橋線</span>
          </button>

          <button onclick="selectLine('wakayamako')" id="lineTab-wakayamako-desktop" class="line-tab px-2.5 sm:px-3 py-1.5 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-xs bg-blue-500"></span>
            <span>和歌山港線</span>
          </button>
        </div>

        <button id="branchExpandBtn" onclick="toggleBranchNav()" class="md:hidden px-2 py-1.5 text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-nankai-card border border-slate-300 dark:border-nankai-border rounded-xl flex items-center justify-center shrink-0 active:scale-95 transition hover:bg-slate-200 dark:hover:bg-slate-800" title="その他路線を展開">
          <i data-lucide="chevron-down" id="branchExpandIcon" class="w-4 h-4"></i>
        </button>

      </div>

      <div id="branchNavGroup" class="hidden md:hidden pt-2 border-t border-slate-200 dark:border-nankai-border/60 flex-wrap gap-1.5">
        <button onclick="selectLine('kada')" id="lineTab-kada" class="line-tab px-2.5 py-1 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2 h-2 rounded-xs bg-blue-500"></span>
          <span>加太線</span>
        </button>

        <button onclick="selectLine('tanagawa')" id="lineTab-tanagawa" class="line-tab px-2.5 py-1 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2 h-2 rounded-xs bg-blue-500"></span>
          <span>多奈川線</span>
        </button>

        <button onclick="selectLine('takashinhama')" id="lineTab-takashinhama" class="line-tab px-2.5 py-1 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2 h-2 rounded-xs bg-blue-500"></span>
          <span>高師浜線</span>
        </button>

        <button onclick="selectLine('shiomibashi')" id="lineTab-shiomibashi" class="line-tab px-2.5 py-1 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2 h-2 rounded-xs bg-emerald-600"></span>
          <span>汐見橋線</span>
        </button>

        <button onclick="selectLine('wakayamako')" id="lineTab-wakayamako" class="line-tab px-2.5 py-1 text-xs font-medium rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center gap-1.5 shrink-0">
          <span class="w-2 h-2 rounded-xs bg-blue-500"></span>
          <span>和歌山港線</span>
        </button>
      </div>

    </div>
  </nav>

  <!-- MODALS AREA -->
  <!-- TRAIN INFOS LIST MODAL -->
  <div id="trainInfoModal" onclick="if(event.target===this)closeModal('trainInfoModal')" class="modal-bottom-sheet fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-center items-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-200">
    <div class="bg-white dark:bg-nankai-panel border border-slate-200 dark:border-nankai-border rounded-2xl max-w-lg w-full p-4 sm:p-5 shadow-2xl transform sm:scale-95 transition-all duration-200 max-h-[85vh] flex flex-col">
      
      <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-3 block sm:hidden shrink-0"></div>

      <div class="flex items-center justify-between border-b border-slate-200 dark:border-nankai-border pb-3 mb-3 shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold">
            <i data-lucide="bell" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">全線 運行情報</h3>
            <p id="infoModalUpdateTime" class="text-[10px] text-slate-500 dark:text-slate-400">最新情報</p>
          </div>
        </div>
        <button onclick="closeModal('trainInfoModal')" class="text-slate-400 hover:text-slate-800 dark:hover:text-white p-1.5 rounded-xl transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="trainInfoListContainer" class="overflow-y-auto space-y-2.5 pr-0.5 flex-1">
        <!-- JS Rendered RSS Train Info Notifications -->
      </div>

      <div class="mt-3 shrink-0">
        <button onclick="closeModal('trainInfoModal')" class="w-full py-2 bg-slate-200 dark:bg-nankai-card hover:bg-slate-300 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs font-bold rounded-xl border border-slate-300 dark:border-nankai-border transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- TRAIN DETAIL MODAL -->
  <div id="trainDetailModal" onclick="if(event.target===this)closeModal('trainDetailModal')" class="modal-bottom-sheet fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-center items-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-200">
    <div class="bg-white dark:bg-nankai-panel border border-slate-200 dark:border-nankai-border rounded-2xl max-w-md w-full p-4 sm:p-5 shadow-2xl transform sm:scale-95 transition-all duration-200 max-h-[90vh] flex flex-col">
      
      <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-3 block sm:hidden shrink-0"></div>

      <div class="flex items-start justify-between border-b border-slate-200 dark:border-nankai-border pb-3 mb-3 shrink-0">
        <div class="flex items-center gap-2">
          <div id="modalTypeBadge" class="px-2.5 py-1 text-xs font-extrabold rounded-lg text-white shadow-xs">特急</div>
          <div>
            <div class="flex items-center gap-2">
              <span id="modalTrainNum" class="text-base sm:text-lg font-black tracking-wider text-slate-900 dark:text-white font-inter">0215</span>
              <span id="modalLineName" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 dark:bg-emerald-500/20 px-2 py-0.5 rounded-md">南海本線</span>
            </div>
            <p id="modalDest" class="text-xs text-slate-700 dark:text-slate-300 font-semibold mt-0.5">関西空港 行き</p>
          </div>
        </div>
        <button onclick="closeModal('trainDetailModal')" class="text-slate-400 hover:text-slate-800 dark:hover:text-white p-1.5 rounded-xl transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="overflow-y-auto space-y-3 pr-0.5 flex-1">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-24 right-4 bg-slate-800 dark:bg-nankai-panel border border-nankai-green text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <i data-lucide="info" class="w-4 h-4 text-emerald-400 shrink-0"></i>
    <span id="toastMsg">通知メッセージ</span>
  </div>

  <script>
    function getLatestTrainJsonUrl() {
      return `https://external-data.nankaiapp.com/tid/trains.json?${Date.now()}`;
    }

    function getLatestTrainInfosUrl() {
      return `https://external-data.nankaiapp.com/rss/train_infos.json?${Date.now()}`;
    }

    let currentLineKey = 'nankai';
    let searchQuery = '';
    let currentViewMode = 'diagram';
    let autoRefreshTimer = null;
    let simulationTimer = null;
    let infoTickerTimer = null;
    let activeGroupTrains = [];
    let isBranchNavExpanded = false;

    let trainDataset = {
      trains: [],
      nankai_update_date: '',
      nankai_update_time: '',
      nankai_schedule_types: 1,
      koya_update_date: '',
      koya_update_time: '',
      koya_schedule_types: 1
    };

    let trainInfosDataset = {
      hash_notifications: []
    };

    let currentTickerNoticeIndex = 0;

    const CAR_NUMBER_REPLACE_MAP = {
      6012: 6903,
      6020: 6909,
      6028: 6907,
      6032: 6913,
      1100: 11001,
      1200: 12001,
      1202: 12021
    };

    const NORMAL_INFO_CONTENT = "只今、20分以上の列車の遅れはございません。";

    function toggleBranchNav() {
      isBranchNavExpanded = !isBranchNavExpanded;
      const groupEl = document.getElementById('branchNavGroup');
      const iconEl = document.getElementById('branchExpandIcon');

      if (groupEl) {
        if (isBranchNavExpanded) {
          groupEl.classList.remove('hidden');
          groupEl.classList.add('flex');
          if (iconEl) iconEl.setAttribute('data-lucide', 'chevron-up');
        } else {
          groupEl.classList.add('hidden');
          groupEl.classList.remove('flex');
          if (iconEl) iconEl.setAttribute('data-lucide', 'chevron-down');
        }
      }
      if (window.lucide) lucide.createIcons();
    }

    async function fetchTrainInfos() {
      try {
        const response = await fetch(getLatestTrainInfosUrl());
        if (response.ok) {
          const data = await response.json();
          if (data && Array.isArray(data.hash_notifications)) {
            trainInfosDataset = data;
            renderTrainInfosHeaderAndModal();
          }
        }
      } catch (err) {
        console.warn('運行情報データの取得に失敗しました:', err);
      }
    }

    function renderTrainInfosHeaderAndModal() {
      const notifications = trainInfosDataset.hash_notifications || [];
      const abnormalInfos = notifications.filter(n => n.content && n.content.trim() !== NORMAL_INFO_CONTENT);

      const statusHeaderBar = document.getElementById('statusHeaderBar');
      const statusIcon = document.getElementById('statusIcon');
      const lineStatusText = document.getElementById('lineStatusText');
      const tickerWrapper = document.getElementById('tickerWrapper');
      const tickerText = document.getElementById('tickerText');
      const statusContentArea = document.getElementById('statusContentArea');

      if (infoTickerTimer) {
        clearTimeout(infoTickerTimer);
        infoTickerTimer = null;
      }

      if (abnormalInfos.length > 0) {
        if (statusHeaderBar) {
          statusHeaderBar.className = "sticky top-0 z-30 cursor-pointer bg-rose-500/15 dark:bg-rose-950/30 backdrop-blur-md hover:bg-rose-500/25 dark:hover:bg-rose-950/50 border-b border-rose-500/30 px-3 py-2 sm:px-5 transition-all shadow-xs";
        }
        if (statusIcon) {
          statusIcon.setAttribute('data-lucide', 'x-circle');
          statusIcon.className = "w-4 h-4 text-rose-600 dark:text-rose-400 shrink-0";
        }

        if (tickerWrapper) tickerWrapper.classList.remove('hidden');

        const runTickerCycle = () => {
          if (!abnormalInfos || abnormalInfos.length === 0) return;
          const notice = abnormalInfos[currentTickerNoticeIndex % abnormalInfos.length];
          
          if (statusContentArea) statusContentArea.classList.add('opacity-0');

          setTimeout(() => {
            if (lineStatusText) {
              lineStatusText.innerText = `【${notice.title.replace(' - 南海電鉄', '')}】`;
              lineStatusText.className = "font-extrabold tracking-wide shrink-0 text-xs sm:text-sm text-rose-900 dark:text-rose-300";
            }
            if (tickerText && tickerWrapper) {
              tickerText.innerText = notice.content;
              tickerText.classList.remove('animate-ticker-dynamic');
              
              const containerWidth = tickerWrapper.offsetWidth || 300;
              const textWidth = tickerText.scrollWidth || 200;

              const speed = 35; // px/sec
              const totalDistance = containerWidth + textWidth;
              const durationSec = totalDistance / speed;

              tickerText.style.setProperty('--ticker-start-pos', `${containerWidth}px`);
              tickerText.style.setProperty('--ticker-end-pos', `-${textWidth}px`);
              tickerText.style.setProperty('--ticker-duration', `${durationSec}s`);

              if (statusContentArea) statusContentArea.classList.remove('opacity-0');

              void tickerText.offsetWidth;
              tickerText.classList.add('animate-ticker-dynamic');

              infoTickerTimer = setTimeout(() => {
                currentTickerNoticeIndex++;
                runTickerCycle();
              }, durationSec * 1000 + 200);
            }
          }, 300);
        };

        currentTickerNoticeIndex = 0;
        runTickerCycle();

      } else {
        if (statusHeaderBar) {
          statusHeaderBar.className = "sticky top-0 z-30 cursor-pointer bg-emerald-500/10 dark:bg-emerald-950/20 backdrop-blur-md hover:bg-emerald-500/20 dark:hover:bg-emerald-950/40 border-b border-emerald-500/20 px-3 py-2 sm:px-5 transition-all shadow-xs";
        }
        if (statusIcon) {
          statusIcon.setAttribute('data-lucide', 'circle');
          statusIcon.className = "w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0";
        }
        if (tickerWrapper) tickerWrapper.classList.add('hidden');
        if (statusContentArea) statusContentArea.classList.remove('opacity-0');
        
        const theme = LINE_THEME_MAP[currentLineKey] || LINE_THEME_MAP.nankai;
        if (lineStatusText) {
          lineStatusText.innerText = `${theme.name} 平常運行`;
          lineStatusText.className = "font-extrabold tracking-wide shrink-0 text-xs sm:text-sm text-slate-900 dark:text-emerald-200";
        }
      }

      const modalListContainer = document.getElementById('trainInfoListContainer');
      if (modalListContainer) {
        if (notifications.length === 0) {
          modalListContainer.innerHTML = `<div class="py-8 text-center text-xs text-slate-400">運行情報はありません</div>`;
        } else {
          modalListContainer.innerHTML = notifications.map(n => {
            const isAbnormal = n.content && n.content.trim() !== NORMAL_INFO_CONTENT;
            const cleanTitle = n.title.replace(' - 南海電鉄', '');
            
            return `
              <div class="p-3 rounded-xl border ${isAbnormal ? 'bg-rose-500/10 border-rose-500/30 dark:bg-rose-950/30' : 'bg-slate-100 dark:bg-nankai-dark border-slate-200 dark:border-nankai-border'} transition">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full ${isAbnormal ? 'bg-rose-500' : 'bg-emerald-500'}"></span>
                    <span class="font-bold text-xs ${isAbnormal ? 'text-rose-800 dark:text-rose-300' : 'text-slate-900 dark:text-white'}">${cleanTitle}</span>
                  </div>
                  <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${isAbnormal ? 'bg-rose-500/20 text-rose-700 dark:text-rose-300' : 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300'}">
                    ${isAbnormal ? '遅延・情報あり' : '平常運行'}
                  </span>
                </div>
                <p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed pl-3.5">
                  ${n.content}
                </p>
              </div>
            `;
          }).join('');
        }
      }

      if (window.lucide) lucide.createIcons();
    }

    function isSameStation(stA, stB) {
      if (stA === stB) return true;
      if (!stA || !stB) return false;

      if ((stA === 14 || stA === 16) && (stB === 14 || stB === 16)) return true;
      if ((stA === 62 || stA === 68) && (stB === 62 || stB === 68)) return true;
      if ((stA === 63 || stA === 69) && (stB === 63 || stB === 69)) return true;

      if ((stA === 151 || stA === 109 || stA === 59) && (stB === 151 || stB === 109 || stB === 59)) return true;
      if ((stA === 152 || stA === 88) && (stB === 152 || stB === 88)) return true;
      if ((stA === 153 || stA === 89) && (stB === 153 || stB === 89)) return true;
      if ((stA === 154 || stA === 90) && (stB === 154 || stB === 90)) return true;
      if ((stA === 155 || stA === 91) && (stB === 155 || stB === 91)) return true;
      if ((stA === 156 || stA === 92) && (stB === 156 || stB === 92)) return true;

      return false;
    }

    function getStationName(stId, lineId = 1) {
      if (!stId) return '不明';

      if (stId === 25) return "千代田信号場";

      if (stId === 62 || stId === 68) return "伽羅橋";
      if (stId === 63 || stId === 69) return "高師浜";
      if (stId === 14 || stId === 16) return "羽衣";

      if (lineId === 2 || lineId === 4) {
        if (stId === 151 || stId === 109 || stId === 59) return "中百舌鳥";
        if (stId === 152 || stId === 88) return "深井";
        if (stId === 153 || stId === 89) return "泉ケ丘";
        if (stId === 154 || stId === 90) return "栂・美木多";
        if (stId === 155 || stId === 91) return "光明池";
        if (stId === 156 || stId === 92) return "和泉中央";
      }

      if (lineId === 1) {
        if (stId === 88) return "東松江";
        if (stId === 89) return "中松江";
        if (stId === 90) return "八幡前";
        if (stId === 91) return "西ノ庄";
        if (stId === 92) return "二里ケ浜";
        if (stId === 93) return "磯ノ浦";
        if (stId === 94) return "加太";
        if (stId === 40) return "紀ノ川";
      }

      return STATION_LOOKUP[stId] || '不明';
    }

    function getLineNameFromTrain(train) {
      if (!train) return '南海本線';
      if (train.line_id === 8) return '汐見橋線';
      if (train.line_id === 2 || train.line_id === 4) {
        const senbokuIds = [151, 152, 153, 154, 155, 156, 59, 109, 88, 89, 90, 91, 92];
        if (senbokuIds.includes(train.station_id) || senbokuIds.includes(train.next_station_id) || [62, 63, 64, 65, 66].includes(train.destination_station_id)) {
          return '泉北線';
        }
        return '高野線';
      }
      if ([76, 77, 50].includes(train.station_id) || [76, 77, 50].includes(train.next_station_id) || [76, 77, 50].includes(train.destination_station_id)) {
        return '空港線';
      }
      const kadaStationIds = [40, 87, 88, 89, 90, 91, 92, 93, 94];
      if (kadaStationIds.includes(train.station_id) && train.destination_station_id === 60) {
        return '加太線';
      }
      if ([81, 82, 83, 84].includes(train.station_id) || train.destination_station_id === 65) {
        return '多奈川線';
      }
      if ([61, 62, 63, 68, 69].includes(train.station_id)) {
        return '高師浜線';
      }
      if ([42, 46].includes(train.station_id) || [42, 46].includes(train.destination_station_id)) {
        return '和歌山港線';
      }
      return '南海本線';
    }

    function isSenbokuStationEqual(stId, targetName, lineId) {
      if (!stId) return false;
      if (lineId === 1) return false;

      if (targetName === "中百舌鳥" && (stId === 151 || stId === 109 || stId === 59)) return true;
      if (targetName === "深井" && (stId === 152 || stId === 88)) return true;
      if (targetName === "泉ケ丘" && (stId === 153 || stId === 89)) return true;
      if (targetName === "栂・美木多" && (stId === 154 || stId === 90)) return true;
      if (targetName === "光明池" && (stId === 155 || stId === 91)) return true;
      if (targetName === "和泉中央" && (stId === 156 || stId === 92)) return true;
      return false;
    }

    function shouldHideCarNumbers(t) {
      if (!t) return false;
      if (t.line_id === 1) return false;

      const stId = t.station_id;
      const nextStId = t.next_station_id;

      const senbokuIds = [151, 152, 153, 154, 155, 156, 59, 109];
      const senbokuAltIds = [88, 89, 90, 91, 92];

      const isInSenboku = 
        (senbokuIds.includes(stId) || senbokuAltIds.includes(stId)) ||
        (nextStId && (senbokuIds.includes(nextStId) || senbokuAltIds.includes(nextStId)));

      if (!isInSenboku) return false;

      if (t.direction === 'down') return true;

      if (t.direction === 'up') {
        const isSectionIzumiKomyo = 
          (isSenbokuStationEqual(stId, "和泉中央", t.line_id) && isSenbokuStationEqual(nextStId, "光明池", t.line_id)) ||
          (isSenbokuStationEqual(stId, "光明池", t.line_id) && isSenbokuStationEqual(nextStId, "和泉中央", t.line_id));

        const isSectionKomyoToga = 
          (isSenbokuStationEqual(stId, "光明池", t.line_id) && isSenbokuStationEqual(nextStId, "栂・美木多", t.line_id)) ||
          (isSenbokuStationEqual(stId, "栂・美木多", t.line_id) && isSenbokuStationEqual(nextStId, "光明池", t.line_id));

      const num = parseInt(numStr, 10) || 0;
      const bandai = Math.floor(num / 100) * 100;

        border = "border-purple-500";

    function getDestinationName(destId, lineId = 1) {
      if (destId === 25) return "千代田信号場";
      if (destId === 62 || destId === 68) return "伽羅橋";
      if (destId === 63 || destId === 69) return "高師浜";
      if (destId === 14 || destId === 16) return "羽衣";

      if (lineId === 8 || currentLineKey === 'shiomibashi') {
        if (destId === 6 || destId === 8 || destId === 142) return "岸里玉出";
        if (DEST_MAP_8L[destId]) return DEST_MAP_8L[destId];
      }
      
      if (lineId === 2 || lineId === 4) {
        if (DEST_MAP_2L[destId]) return DEST_MAP_2L[destId];
      } else {
        if (DEST_MAP_1L[destId]) return DEST_MAP_1L[destId];
      }
      return getStationName(destId, lineId);

    function filterTrainsForLine(lineKey) {
      const stations = STATION_MASTER[lineKey] || [];
      const stationIds = stations.map(s => s.id);
      const allTrains = trainDataset.trains || [];

      return allTrains.filter(t => {
        let lineMatch = false;

        if (lineKey === 'kuko') {
          lineMatch = [76, 77, 50].includes(t.station_id) || [76, 77, 50].includes(t.next_station_id) || [76, 77, 50].includes(t.destination_station_id);
        } else if (lineKey === 'senboku') {
          const senbokuIds = [151, 152, 153, 154, 155, 156, 59, 109, 88, 89, 90, 91, 92];
          lineMatch = (t.line_id === 2 || t.line_id === 4) && (
            senbokuIds.includes(t.station_id) ||
            senbokuIds.includes(t.next_station_id) ||
            senbokuIds.includes(t.destination_station_id) ||
            [62, 63, 64, 65, 66].includes(t.destination_station_id)
          );
        } else if (lineKey === 'kada') {
          const kadaStationIds = [40, 87, 88, 89, 90, 91, 92, 93, 94];
          lineMatch = (t.line_id === 1) && (
            kadaStationIds.includes(t.station_id) ||
            (t.next_station_id && kadaStationIds.includes(t.next_station_id)) ||
            t.destination_station_id === 60
          );
        } else if (lineKey === 'tanagawa') {
          lineMatch = [81, 82, 83, 84].includes(t.station_id) ||
                      [81, 82, 83, 84].includes(t.next_station_id) ||
                      t.destination_station_id === 65;
        } else if (lineKey === 'takashinhama') {
          const takashinhamaSts = [14, 16, 61, 62, 63, 68, 69];
          const isTakashinhamaSt = takashinhamaSts.some(id => isSameStation(id, t.station_id)) || 
                                  (t.next_station_id && takashinhamaSts.some(id => isSameStation(id, t.next_station_id)));
          const isTakashinhamaDest = [62, 63, 68, 69, 14, 16].some(id => isSameStation(id, t.destination_station_id));
          const kindName = getTrainKindInfo(t).name;
          const isTakashinhamaKind = kindName.includes("高師浜") || [15200, 15300].includes(Math.floor((parseInt((t.train_number || "").toString().replace(/\D/g, ''), 10) || 0) / 100) * 100 + (t.line_id || 1) * 10000);

          lineMatch = (t.line_id === 1) && (
            [61, 62, 63, 68, 69].some(id => isSameStation(id, t.station_id)) ||
            (t.next_station_id && [61, 62, 63, 68, 69].some(id => isSameStation(id, t.next_station_id))) ||
            isTakashinhamaKind ||
            (isTakashinhamaSt && isTakashinhamaDest)
          );
        } else if (lineKey === 'shiomibashi') {
          lineMatch = t.line_id === 8 || [137, 138, 139, 140, 141, 142].includes(t.station_id);
        } else if (lineKey === 'wakayamako') {
          lineMatch = [42, 46].includes(t.station_id) || [42, 46].includes(t.destination_station_id);
        } else if (lineKey === 'nankai') {
          if (t.line_id !== 1) return false;
          if ([87, 88, 89, 90, 91, 92, 93, 94].includes(t.station_id) && t.destination_station_id === 60) return false;
          if ([81, 82, 83].includes(t.station_id)) return false;
          if ([62, 63, 68, 69].includes(t.station_id)) return false;
          if ([62, 63, 68, 69].includes(t.destination_station_id)) return false;
          if (getTrainKindInfo(t).name.includes("高師浜")) return false;

          lineMatch = stationIds.some(sId => isSameStation(sId, t.station_id)) || 
                      (t.next_station_id && stationIds.some(sId => isSameStation(sId, t.next_station_id)));
        } else if (lineKey === 'koya') {
          if (t.line_id !== 2) return false;
          lineMatch = stationIds.some(sId => isSameStation(sId, t.station_id)) || 
                      (t.next_station_id && stationIds.some(sId => isSameStation(sId, t.next_station_id))) ||
                      (t.station_id === 25 || t.destination_station_id === 25);
        } else {
          lineMatch = stationIds.some(sId => isSameStation(sId, t.station_id)) || 
                      (t.next_station_id && stationIds.some(sId => isSameStation(sId, t.next_station_id)));
        }

        if (!lineMatch) return false;

        if (searchQuery) {
          const numMatch = t.train_number.toLowerCase().includes(searchQuery);
          const destMatch = getDestinationName(t.destination_station_id, t.line_id).toLowerCase().includes(searchQuery);
          const carStr = getFormattedCarNumbers(t).toLowerCase();
          const carMatch = carStr && carStr.includes(searchQuery);
          if (!numMatch && !destMatch && !carMatch) return false;
        }

        return true;
      });
    }

    function isTrainAtStation(t, stId) {
      if (!isSameStation(t.station_id, stId)) return false;
      return !t.next_station_id || isSameStation(t.next_station_id, stId);
    }

    function isTrainInSection(t, stId, nextStId, stations, secIdx) {
      if (!t.next_station_id || isSameStation(t.next_station_id, t.station_id)) return false;

      if (isSameStation(t.station_id, stId) && isSameStation(t.next_station_id, nextStId)) return true;
      if (isSameStation(t.station_id, nextStId) && isSameStation(t.next_station_id, stId)) return true;

      if (stId === 28 && isSameStation(t.station_id, 28) && isSameStation(t.next_station_id, 76) && secIdx === 0) return true;
      if (stId === 40 && (isSameStation(t.station_id, 88) || isSameStation(t.station_id, 87)) && secIdx === 0) return true;

      const idxA = stations.findIndex(s => isSameStation(s.id, t.station_id));
      const idxB = stations.findIndex(s => isSameStation(s.id, t.next_station_id));

      if (idxA !== -1) {
        if (idxB !== -1 && Math.abs(idxA - idxB) <= 2) {
          const minIdx = Math.min(idxA, idxB);
          const maxIdx = Math.max(idxA, idxB);
          if (secIdx >= minIdx && secIdx < maxIdx) {
            if (t.direction === 'down' && secIdx === idxA) return true;
            if (t.direction === 'up' && secIdx === idxA - 1) return true;
          }
        } else {
          if (t.direction === 'up' && idxA > 0) {
            if (secIdx === idxA - 1) return true;
          } else if (t.direction === 'down' && idxA < stations.length - 1) {
            if (secIdx === idxA) return true;
          }
        }
      }

      return false;
    }

      stations.forEach((st, idx) => {
        const stRow = document.createElement('div');
        // 明暗差を抑えるため、駅行（#0e0e0e系）と駅間行（#0a0a0a系）の背景色の輝度差を小さく調整
        stRow.className = "grid grid-cols-12 items-center py-2 px-2 sm:px-4 bg-slate-50/80 dark:bg-[#0e0e0e] hover:bg-slate-100 dark:hover:bg-[#121212] transition border-b border-slate-200/50 dark:border-nankai-border/20 relative min-h-[88px] sm:min-h-[96px] w-full";

        const upAtSt = trains.filter(t => t.direction === 'up' && isTrainAtStation(t, st.id));
        const downAtSt = trains.filter(t => t.direction === 'down' && isTrainAtStation(t, st.id));

        stRow.innerHTML = `
          <div class="col-span-5 col-start-1 min-w-0 flex items-center justify-end gap-1 sm:gap-2 pr-1 sm:pr-2 z-10 my-auto w-full">
            ${renderTrackCellContent(upAtSt, `${st.name} 停車中`, '▲ 上り')}
          </div>

          <div class="col-span-2 col-start-6 min-w-0 text-center py-1 flex flex-col items-center justify-center relative my-auto">
            <div class="font-black text-[11px] sm:text-xs md:text-sm text-slate-900 dark:text-slate-100 tracking-tighter sm:tracking-normal truncate z-10 bg-slate-100/90 dark:bg-[#161616] px-2 sm:px-3 py-1 rounded-xl border border-slate-300 dark:border-nankai-border/60 shadow-xs max-w-full">${st.name}</div>
            <div class="text-[8px] sm:text-[10px] font-mono font-bold text-slate-500 dark:text-slate-500 z-10 mt-0.5 font-inter">${st.num}</div>
          </div>

          <div class="col-span-5 col-start-8 min-w-0 flex items-center justify-start gap-1 sm:gap-2 pl-1 sm:pl-2 z-10 my-auto w-full">
            ${renderTrackCellContent(downAtSt, `${st.name} 停車中`, '▼ 下り')}
          </div>
        `;
        container.appendChild(stRow);

        if (idx < stations.length - 1) {
          const nextSt = stations[idx + 1];
          const secRow = document.createElement('div');
          secRow.className = "grid grid-cols-12 items-stretch py-1.5 px-2 sm:px-4 bg-slate-100/40 dark:bg-[#0a0a0a] text-[11px] border-b border-slate-200/40 dark:border-nankai-border/10 relative min-h-[88px] sm:min-h-[96px] w-full";

          const upInSec = trains.filter(t => t.direction === 'up' && isTrainInSection(t, st.id, nextSt.id, stations, idx));
          const downInSec = trains.filter(t => t.direction === 'down' && isTrainInSection(t, st.id, nextSt.id, stations, idx));

          secRow.innerHTML = `
            <div class="col-span-5 col-start-1 min-w-0 flex items-center justify-end gap-1 sm:gap-2 pr-1 sm:pr-2 py-1.5 z-10 my-auto w-full">
              ${renderTrackCellContent(upInSec, `${st.name} 〜 ${nextSt.name}`, '▲ 上り')}
            </div>

            <div class="col-span-2 col-start-6 min-w-0 flex justify-center items-center py-0 z-0">
              <div class="w-1.5 sm:w-2.5 h-full min-h-[88px] sm:min-h-[96px] ${theme.lineBgClass} opacity-80 mx-auto"></div>
            </div>

            <div class="col-span-5 col-start-8 min-w-0 flex items-center justify-start gap-1 sm:gap-2 pl-1 sm:pl-2 py-1.5 z-10 my-auto w-full">
              ${renderTrackCellContent(downInSec, `${st.name} 〜 ${nextSt.name}`, '▼ 下り')}
            </div>
          `;
          container.appendChild(secRow);
        }
      });

      if (window.lucide) lucide.createIcons();
    }

    function renderTrackCellContent(trainList, locationName, dirText) {
      if (!trainList || trainList.length === 0) return '';
      
      if (trainList.length === 1) {
        return createTrainBadgeHTML(trainList[0]);
      } else {
        return createGroupTrainBadgeHTML(trainList, locationName, dirText);
      }
    }

      const kindInfo = getTrainKindInfo(t);
      const destName = getDestinationName(t.destination_station_id, t.line_id);

    function createGroupTrainBadgeHTML(trains, locationName, dirText) {

      return `

    function openGroupTrainModal(groupDataKey, locationName, dirText) {
      try {
        const numbers = JSON.parse(decodeURIComponent(groupDataKey));
        const groupTrains = (trainDataset.trains || []).filter(t => numbers.includes(t.train_number));
        activeGroupTrains = groupTrains;

        const titleEl = document.getElementById('groupModalTitle');
        const subEl = document.getElementById('groupModalSub');
        const listEl = document.getElementById('groupTrainList');

        if (titleEl) titleEl.innerText = `${locationName} (${dirText})`;
        if (subEl) subEl.innerText = `在線列車 ${groupTrains.length} 編成`;

        if (listEl) {
          listEl.innerHTML = groupTrains.map(t => {
            const kindInfo = getTrainKindInfo(t);
            const destName = getDestinationName(t.destination_station_id, t.line_id);
            const carStr = getFormattedCarNumbers(t);
            const delayText = t.delay > 0 ? `<span class="text-rose-500 font-bold ml-1">+${t.delay}分遅れ</span>` : '<span class="text-emerald-600 font-bold ml-1">定時</span>';

            return `
              <div onclick="selectTrainFromGroupModal('${t.train_number}')" 
                class="bg-slate-100 dark:bg-nankai-card border ${kindInfo.border} hover:border-emerald-500 rounded-xl p-3 flex items-center justify-between cursor-pointer transition active:scale-98 shadow-xs">
                <div class="flex items-center gap-2.5">
                  <span class="${kindInfo.badgeBg} text-xs font-black px-2 py-1 rounded-lg shrink-0 border">${kindInfo.name}</span>
                  <div>
                    <div class="flex items-center gap-1.5 text-xs font-extrabold text-slate-900 dark:text-white">
                      <span class="font-mono text-sm">${t.train_number}</span>
                      <span>＞</span>
                      <span>${destName} 行き</span>
                    </div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 font-mono mt-0.5">
                      ${carStr ? `車番: ${carStr}` : ''} ${delayText}
                    </div>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
              </div>
            `;
          }).join('');
        }

        if (window.lucide) lucide.createIcons();
        openModal('groupTrainModal');
      } catch (err) {
        console.error('Group modal open error:', err);
      }
    }

    function selectTrainFromGroupModal(trainNum) {
      closeModal('groupTrainModal');
      setTimeout(() => {
        openTrainDetail(trainNum);
      }, 150);
    }

    function renderCardsView(trains) {
      const container = document.getElementById('cardsContainer');
      if (!container) return;
      container.innerHTML = '';

      if (trains.length === 0) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs font-semibold">該当する列車はありません</div>`;
        return;
      }

      trains.forEach(t => {
        const kindInfo = getTrainKindInfo(t);
        const destName = getDestinationName(t.destination_station_id, t.line_id);
        const stName = getStationName(t.station_id, t.line_id);

        const carStr = getFormattedCarNumbers(t);

        const dirBadge = t.direction === 'up' 
          ? '<span class="text-sky-500 dark:text-sky-400 font-black">▲ 上り</span>' 
          : '<span class="text-rose-500 dark:text-rose-400 font-black">▼ 下り</span>';

        const card = document.createElement('div');
        card.className = `bg-white dark:bg-nankai-panel border ${kindInfo.border} rounded-2xl p-3 sm:p-3.5 hover:border-slate-400 dark:hover:border-slate-600 transition cursor-pointer flex flex-col justify-between gap-2 shadow-md active:scale-98`;
        card.onclick = () => openTrainDetail(t.train_number);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="${kindInfo.badgeBg} font-bold text-[10px] px-2 py-0.5 rounded-lg border">${kindInfo.name}</span>
              <span class="font-mono text-xs font-bold text-slate-500 dark:text-slate-300 font-inter">${dirBadge} #${t.train_number}</span>
            </div>
            <div class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1">
              <span>${destName} 行き</span>
            </div>
          </div>

          <div class="bg-slate-100 dark:bg-nankai-dark p-2 rounded-xl border border-slate-200 dark:border-nankai-border text-[11px] space-y-1">
            <div class="flex justify-between text-slate-500 dark:text-slate-400">
              <span>位置:</span>
              <span class="text-emerald-600 dark:text-emerald-400 font-bold">${stName} ${t.next_station_id ? '付近' : '停車中'}</span>
            </div>
            <div class="flex justify-between text-slate-500 dark:text-slate-400">
              <span>編成:</span>
              <span class="text-slate-800 dark:text-slate-200 font-semibold font-mono font-inter">${carStr ? carStr : ''}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      if (window.lucide) lucide.createIcons();
    }

    function renderAll() {
      const lineTrains = filterTrainsForLine(currentLineKey);

      if (currentViewMode === 'diagram') {
        renderDiagramView(lineTrains);
      } else {
        renderCardsView(lineTrains);
      }
    }

    function openTrainDetail(trainNum) {
      if (!trainDataset.trains) return;
      const train = trainDataset.trains.find(t => t.train_number === trainNum);
      if (!train) return;

      const kindInfo = getTrainKindInfo(train);
      const destName = getDestinationName(train.destination_station_id, train.line_id);
      const stName = getStationName(train.station_id, train.line_id);
      const lineName = getLineNameFromTrain(train);

      const typeBadge = document.getElementById('modalTypeBadge');
      if (typeBadge) {
        typeBadge.innerText = kindInfo.name;
        typeBadge.className = `px-2.5 py-1 text-xs font-extrabold rounded-lg text-white ${kindInfo.bg} ${kindInfo.border} border`;
      }

      const trainNumEl = document.getElementById('modalTrainNum');
      if (trainNumEl) trainNumEl.innerText = train.train_number;

      const lineNameEl = document.getElementById('modalLineName');
      if (lineNameEl) lineNameEl.innerText = lineName;

      const destEl = document.getElementById('modalDest');
      if (destEl) destEl.innerText = `${destName} 行き`;
      
      const locEl = document.getElementById('modalLocation');
      if (locEl) {
        if (train.next_station_id && !isSameStation(train.station_id, train.next_station_id)) {
          let locationSectionStr = "";

          if ((train.destination_station_id === 25 || train.next_station_id === 25) && isSameStation(train.station_id, 118)) {
            locationSectionStr = "千代田 〜 河内長野";
          } else {
            const stations = STATION_MASTER[currentLineKey] || [];
            const idxA = stations.findIndex(s => isSameStation(s.id, train.station_id));
            const idxB = stations.findIndex(s => isSameStation(s.id, train.next_station_id));

            if (idxA !== -1 && idxB !== -1 && Math.abs(idxA - idxB) <= 2) {
              const nextStName = getStationName(train.next_station_id, train.line_id);
              locationSectionStr = `${stName} 〜 ${nextStName}`;
            } else if (idxA !== -1) {
              if (train.direction === 'up' && idxA > 0) {
                locationSectionStr = `${stations[idxA - 1].name} 〜 ${stName}`;
              } else if (train.direction === 'down' && idxA < stations.length - 1) {
                locationSectionStr = `${stName} 〜 ${stations[idxA + 1].name}`;
              } else {
                const nextStName = getStationName(train.next_station_id, train.line_id);
                locationSectionStr = `${stName} 〜 ${nextStName}`;
              }
            } else {
              const nextStName = getStationName(train.next_station_id, train.line_id);
              locationSectionStr = `${stName} 〜 ${nextStName}`;
            }
          }
          locEl.innerText = `${locationSectionStr} 走行中`;
        } else {
          locEl.innerText = `${stName} 停車中`;
        }
      }

      const dirEl = document.getElementById('modalDirection');
      if (dirEl) dirEl.innerText = train.direction === 'up' ? '▲ 上り' : '▼ 下り';
      
      const delayEl = document.getElementById('modalDelay');
      if (delayEl) {
        if (train.delay > 0) {
          delayEl.innerText = `${train.delay} 分遅れ`;
          delayEl.className = "text-rose-500 dark:text-rose-400 font-bold font-inter";
        } else {
          delayEl.innerText = "定時 (遅延なし)";
          delayEl.className = "text-emerald-600 dark:text-emerald-400 font-bold";
        }
      }

      const lenEl = document.getElementById('modalLength');
      if (lenEl) lenEl.innerText = `${train.train_length_id || 4} 両編成`;

      const carNums = getFormattedCarNumbers(train);
      const carEl = document.getElementById('modalCarNumbers');
      if (carEl) carEl.innerText = carNums || '';

      openModal('trainDetailModal');
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.remove('opacity-0', 'pointer-events-none');
      const card = modal.querySelector('div');
      if (card) card.classList.remove('scale-95');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function updateMetaInfoDisplay() {
      const nTime = document.getElementById('metaNankaiTime');
      const nType = document.getElementById('metaNankaiType');
      const kTime = document.getElementById('metaKoyaTime');
      const kType = document.getElementById('metaKoyaType');

      if (nTime && trainDataset.nankai_update_time) {
        nTime.innerText = trainDataset.nankai_update_time;
      }
      if (nType && trainDataset.nankai_schedule_types !== undefined) {
        nType.innerText = `ID: ${trainDataset.nankai_schedule_types}`;
      }
      if (kTime && trainDataset.koya_update_time) {
        kTime.innerText = trainDataset.koya_update_time;
      }
      if (kType && trainDataset.koya_schedule_types !== undefined) {
        kType.innerText = `ID: ${trainDataset.koya_schedule_types}`;
      }
      
      const infoModalTime = document.getElementById('infoModalUpdateTime');
      if (infoModalTime) {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        infoModalTime.innerText = `取得時刻: ${timeStr}`;
      }
    }

    function setRefreshingState(isRefreshing) {
      const icons = document.querySelectorAll('.refresh-icon, [data-lucide="refresh-cw"]');
      icons.forEach(icon => {
        if (isRefreshing) {
          icon.classList.add('animate-spin');
        } else {
          icon.classList.remove('animate-spin');
        }
      });
    }

    async function fetchTrainDataFromUrl(url) {
      setRefreshingState(true);

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        if (data && Array.isArray(data.trains)) {
          trainDataset = data;
          updateMetaInfoDisplay();
          renderAll();
          showToast('最新データを取得しました');
        } else {
          throw new Error('Invalid JSON structure');
        }
      } catch (error) {
        console.warn('URLからのデータ取得に失敗しました:', error);
        showToast('データ取得エラーが発生しました');
      } finally {
        setRefreshingState(false);
      }
    }

    function refreshData() {
      fetchTrainDataFromUrl(getLatestTrainJsonUrl());
      fetchTrainInfos();
    }

    function handleAutoRefreshChange(val) {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      const secs = parseInt(val);
      if (secs > 0) {
        autoRefreshTimer = setInterval(() => {
          refreshData();
        }, secs * 1000);
      }
    }

    function loadRawJson() {
      try {
        const raw = document.getElementById('rawJsonArea').value;
        const parsed = JSON.parse(raw);
        if (parsed.trains && Array.isArray(parsed.trains)) {
          trainDataset = parsed;
          updateMetaInfoDisplay();
          renderAll();
          closeModal('dataConfigModal');
          showToast("貼り付けデータを適用しました");
        } else {
          showToast("エラー: 'trains' 配列が見つかりません");
        }
      } catch (err) {
        showToast("エラー: JSONフォーマットが無効です");
      }
    }

    function loadRawTrainInfos() {
      try {
        const rawArea = document.getElementById('rawTrainInfosArea');
        if (!rawArea) return;
        const raw = rawArea.value.trim();
        if (!raw) return;

        let parsed;
        if (raw.startsWith('{') || raw.startsWith('[')) {
          parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            parsed = { hash_notifications: parsed };
          }
        } else {
          parsed = {
            hash_notifications: [{
              title: "運行情報テスト - 南海電鉄",
              content: raw.replace(/<[^>]*>?/gm, ''),
              line: "南海線",
              delay: true
            }]
          };
        }

        if (parsed && Array.isArray(parsed.hash_notifications)) {
          trainInfosDataset = parsed;
          renderTrainInfosHeaderAndModal();
          showToast("運行情報をテスト適用しました");
        } else {
          showToast("エラー: 通知データ構造が無効です");
        }
      } catch (err) {
        showToast("エラー: データの解析に失敗しました");
      }
    }

    function toggleSimulation(active) {
      if (active) {
        showToast("デモ用シミュレーションを開始しました");
        simulationTimer = setInterval(() => {
          if (trainDataset.trains) {
            trainDataset.trains.forEach(t => {
              if (Math.random() > 0.65) {
                if (t.next_station_id) {
                  t.station_id = t.next_station_id;
                  t.next_station_id = null;
                } else {
                  t.direction = t.direction === 'up' ? 'down' : 'up';
                }
              }
            });
            renderAll();
          }
        }, 3000);
      } else {
        if (simulationTimer) clearInterval(simulationTimer);
        showToast("シミュレーションを停止しました");
      }
    }

    window.onload = function() {
      if (window.lucide) lucide.createIcons();
      handleAutoRefreshChange(0);
      updateLineStatusAndHeader();
      fetchTrainDataFromUrl(getLatestTrainJsonUrl());
      fetchTrainInfos();
    };
  </script>
</body>
</html>
